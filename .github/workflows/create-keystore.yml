name: Create Keystore (bir dəfə)

# BİR DƏFƏ işlət: imza açarı yaradır və 4 dəyəri secrets.txt faylına yazır.
# Sonra Actions -> bu run -> Artifacts -> keystore-secrets faylını endir,
# içindəki 4 dəyəri Settings -> Secrets and variables -> Actions bölməsinə əlavə et.
# Artifact 1 gün sonra silinir. Repo public-dirsə, əlavə etdikdən dərhal sonra run-u sil.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Açar yarat
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore keramo.keystore \
            -alias keramo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Keramo Bazar, O=Keramo, C=AZ"
          {
            echo "KERAMO_KEYSTORE_B64:"
            base64 -w0 keramo.keystore
            echo
            echo
            echo "KERAMO_KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo
            echo "KERAMO_KEY_ALIAS:"
            echo "keramo"
            echo
            echo "KERAMO_KEY_PASSWORD:"
            echo "$PASS"
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
