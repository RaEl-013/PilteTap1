name: Create Keystore (bir dÉ™fÉ™)

# BÄ°R DÆFÆ iÅŸlÉ™t: imza aÃ§arÄ± yaradÄ±r vÉ™ 4 dÉ™yÉ™ri secrets.txt faylÄ±na yazÄ±r.
# Sonra Actions -> bu run -> Artifacts -> keystore-secrets faylÄ±nÄ± endir,
# iÃ§indÉ™ki 4 dÉ™yÉ™ri Settings -> Secrets and variables -> Actions bÃ¶lmÉ™sinÉ™ É™lavÉ™ et.
# Artifact 1 gÃ¼n sonra silinir. Repo public-dirsÉ™, É™lavÉ™ etdikdÉ™n dÉ™rhal sonra run-u sil.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: AÃ§ar yarat
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore keramo.keystore \
            -alias keramo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Keramo Bazar, O=Keramo, C=AZ"
          {
            echo "KERAMO_KEYSTORE_B64:"
            base64 -w0 keramo.keystore
            echo
            echo
            echo "KERAMO_KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo
            echo "KERAMO_KEY_ALIAS:"
            echo "keramo"
            echo
            echo "KERAMO_KEY_PASSWORD:"
            echo "$PASS"
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
