name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sabit debug keystore yaz (kataloqun itməməsi üçün)
        run: echo "" | base64 -d > app/debug.keystore
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: AI modellərini və ONNX Runtime Web-i yüklə
        run: |
          set -e
          mkdir -p app/src/main/assets/model app/src/main/assets/ort
          curl -L --fail -o app/src/main/assets/model/model_quantized.onnx \
            https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx
          curl -L --fail -o app/src/main/assets/model/clip_vision_quantized.onnx \
            https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx
          npm install onnxruntime-web@1.18.0 --no-save --no-audit --no-fund
          cp node_modules/onnxruntime-web/dist/ort.wasm.min.js app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm.wasm app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd.wasm app/src/main/assets/ort/
          echo "--- assets/model ---"; ls -la app/src/main/assets/model
          echo "--- assets/ort ---"; ls -la app/src/main/assets/ort
      - name: OCR (etiket oxumaq) modulunu yüklə
        run: |
          set -e
          mkdir -p app/src/main/assets/ocr
          npm install tesseract.js@5.1.1 tesseract.js-core@5.1.1 --no-save --no-audit --no-fund
          cp node_modules/tesseract.js/dist/tesseract.min.js app/src/main/assets/ocr/
          cp node_modules/tesseract.js/dist/worker.min.js app/src/main/assets/ocr/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.js app/src/main/assets/ocr/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm app/src/main/assets/ocr/
          curl -L --fail -o app/src/main/assets/ocr/eng.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          echo "--- assets/ocr ---"; ls -la app/src/main/assets/ocr
      - name: Tətbiq ikonunu yaz (Keramo Bazar loqosu)
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap
          echo "" | base64 -d > app/src/main/res/mipmap/ic_launcher.png
          echo "" | base64 -d > app/src/main/res/mipmap/ic_launcher_round.png
          ls -la app/src/main/res/mipmap
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plite-tap-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/**
          if-no-files-found: warn
