name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- İMZA AÇARI (GitHub Secrets-dən) ----------
      # Settings -> Secrets -> Actions:
      #   KERAMO_KEYSTORE_B64, KERAMO_KEYSTORE_PASSWORD, KERAMO_KEY_ALIAS, KERAMO_KEY_PASSWORD
      - name: Keystore yarat (Secrets-dən, yoxdursa müvəqqəti)
        run: |
          if [ -n "${{ secrets.KERAMO_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KERAMO_KEYSTORE_B64 }}" | base64 -d > app/keramo.keystore
            echo "keystore=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KERAMO_KEYSTORE_B64 tapılmadı - müvəqqəti keystore yaradılır. ÖZ AÇARINIZI Secrets-ə əlavə edin!"
            keytool -genkey -v -keystore app/keramo.keystore \
              -alias keramo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass keramo123 -keypass keramo123 \
              -dname "CN=Keramo Bazar, O=Keramo, C=AZ"
          fi
        id: keystore

      # ---------- AI MODELLƏRİ ----------
      - name: DINOv2 + CLIP modellərini yüklə
        run: |
          mkdir -p app/src/main/assets/model
          curl -L --retry 3 -o app/src/main/assets/model/model_quantized.onnx \
            https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx
          curl -L --retry 3 -o app/src/main/assets/model/clip_vision_quantized.onnx \
            https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx

      # ---------- ONNX RUNTIME WEB (WASM) ----------
      - name: ONNX Runtime Web fayllarını yüklə
        run: |
          mkdir -p app/src/main/assets/ort
          npm install onnxruntime-web@1.18.0 --no-save
          cp node_modules/onnxruntime-web/dist/ort.wasm.min.js app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm.wasm app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd.wasm app/src/main/assets/ort/

      # ---------- TESSERACT.JS + OCR (eng + aze + rus) ----------
      # index.html gözləyir: ocr/tesseract.min.js, ocr/worker.min.js,
      # ocr/tesseract-core-simd-lstm.js, ocr/*.traineddata
      - name: Tesseract.js və dilləri yüklə
        run: |
          mkdir -p app/src/main/assets/ocr
          curl -L --retry 3 -o app/src/main/assets/ocr/tesseract.min.js \
            https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js
          curl -L --retry 3 -o app/src/main/assets/ocr/worker.min.js \
            https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js
          curl -L --retry 3 -o app/src/main/assets/ocr/tesseract-core-simd-lstm.js \
            https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract-core-simd-lstm.js
          for L in eng aze rus; do
            curl -L --retry 3 -o app/src/main/assets/ocr/$L.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$L.traineddata
          done

      # ---------- LOQO İKONU ----------
      - name: Loqo ikonu (secrets-də varsa)
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if [ -n "${{ secrets.KERAMO_ICON_URL }}" ]; then
            curl -L --retry 3 -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
              "${{ secrets.KERAMO_ICON_URL }}"
          else
            echo "::notice::KERAMO_ICON_URL yoxdur - mövcud ikon qalır."
          fi

      # ---------- APK QUR ----------
      - name: APK qur (versiya = run nömrəsi)
        env:
          KERAMO_STORE_PASSWORD: ${{ secrets.KERAMO_KEYSTORE_PASSWORD || 'keramo123' }}
          KERAMO_KEY_PASSWORD: ${{ secrets.KERAMO_KEY_PASSWORD || 'keramo123' }}
          KERAMO_KEY_ALIAS: ${{ secrets.KERAMO_KEY_ALIAS || 'keramo' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=v${{ github.run_number }}

      - name: APK artifact olaraq saxla
        uses: actions/upload-artifact@v4
        with:
          name: plite-tap-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Uğursuzluqda hesabat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
