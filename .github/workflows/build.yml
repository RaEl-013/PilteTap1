name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------- İMZA AÇARI (GitHub Secrets-dən) ----------
      # Secrets: KERAMO_KEYSTORE_B64, KERAMO_KEYSTORE_PASSWORD, KERAMO_KEY_ALIAS, KERAMO_KEY_PASSWORD
      # Açar yoxdursa build DAYANIR (hər dəfə yeni açar yaransa, proqram köhnənin üzərinə qurulmur).
      # Açarı yaratmaq üçün "Create Keystore (bir dəfə)" workflow-unu işlət.
      - name: Keystore hazırla (Secrets-dən)
        env:
          KS_B64: ${{ secrets.KERAMO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KERAMO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::KERAMO_KEYSTORE_B64 secret-i yoxdur. Əvvəlcə 'Create Keystore (bir dəfə)' workflow-unu işlət və 4 dəyəri Secrets-ə əlavə et."
            exit 1
          fi
          # boşluq, sətir keçidi, dırnaq və təsadüfən kopyalanmış "KERAMO_KEYSTORE_B64:" yazısı təmizlənir
          printf '%s' "$KS_B64" | sed 's/^KERAMO_KEYSTORE_B64:*//' | tr -d ' \r\n\t"' | base64 -d > app/keramo.keystore || {
            echo "::error::KERAMO_KEYSTORE_B64 dəyəri düzgün deyil (base64 oxunmur). Secret-i silib secrets.txt-dəki UZUN sətri tam kopyalayıb yenidən yarat."
            exit 1
          }
          # diaqnostika (dəyərlər yox, yalnız ölçülər göstərilir)
          echo "Keystore ölçüsü: $(wc -c < app/keramo.keystore) bayt (Create Keystore ilə yaradılan açar üçün təxminən 2500-3000)"
          echo "KERAMO_KEYSTORE_PASSWORD uzunluğu: ${#KS_PASS} (Create Keystore ilə yaradılan parol üçün 32)"
          CLEAN_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n\t"')
          if [ "$CLEAN_PASS" != "$KS_PASS" ]; then
            echo "::error::KERAMO_KEYSTORE_PASSWORD içində boşluq, sətir keçidi və ya dırnaq var. Secret-i silib yalnız parolu (boşluqsuz) yenidən yarat."
            exit 1
          fi
          if ! OUT=$(keytool -list -keystore app/keramo.keystore -storepass "$KS_PASS" 2>&1); then
            echo "keytool cavabı: $OUT"
            echo "::error::Keystore açılmadı. Ya KERAMO_KEYSTORE_PASSWORD bu açara aid deyil (başqa run-dan?), ya da KERAMO_KEYSTORE_B64 tam deyil (kəsilib)."
            exit 1
          fi

      # ---------- AI MODELLƏRİ ----------
      - name: DINOv2 + CLIP modellərini yüklə
        run: |
          mkdir -p app/src/main/assets/model
          curl -fL --retry 3 -o app/src/main/assets/model/model_quantized.onnx \
            https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx
          curl -fL --retry 3 -o app/src/main/assets/model/clip_vision_quantized.onnx \
            https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx

      # ---------- ONNX RUNTIME WEB (WASM) ----------
      - name: ONNX Runtime Web fayllarını yüklə
        run: |
          mkdir -p app/src/main/assets/ort
          npm install onnxruntime-web@1.18.0 --no-save
          cp node_modules/onnxruntime-web/dist/ort.wasm.min.js app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm.wasm app/src/main/assets/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd.wasm app/src/main/assets/ort/

      # ---------- TESSERACT.JS + OCR (stiker oxumaq üçün, yalnız ingilis dili) ----------
      # Core faylları tesseract.js-core paketindədir (CDN-dəki dist/ qovluğunda yoxdur).
      - name: Tesseract.js və dil faylını yüklə
        run: |
          mkdir -p app/src/main/assets/ocr
          npm install tesseract.js@5 --no-save
          cp node_modules/tesseract.js/dist/tesseract.min.js app/src/main/assets/ocr/
          cp node_modules/tesseract.js/dist/worker.min.js app/src/main/assets/ocr/
          cp node_modules/tesseract.js-core/tesseract-core*lstm* app/src/main/assets/ocr/
          curl -fL --retry 3 -o app/src/main/assets/ocr/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          ls -la app/src/main/assets/ocr

      # ---------- LOQO İKONU ----------
      - name: Loqo ikonu (secrets-də varsa)
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          if [ -n "${{ secrets.KERAMO_ICON_URL }}" ]; then
            curl -fL --retry 3 -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
              "${{ secrets.KERAMO_ICON_URL }}"
          else
            echo "::notice::KERAMO_ICON_URL yoxdur - mövcud ikon qalır."
          fi

      # ---------- GRADLE WRAPPER ----------
      - name: Gradle quraşdır və wrapper yarat
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Wrapper jar yarat (əgər repo-da yoxdursa)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      # ---------- APK QUR ----------
      - name: APK qur (versiya = run nömrəsi)
        env:
          KERAMO_STORE_PASSWORD: ${{ secrets.KERAMO_KEYSTORE_PASSWORD }}
          KERAMO_KEY_PASSWORD: ${{ secrets.KERAMO_KEY_PASSWORD }}
          KERAMO_KEY_ALIAS: ${{ secrets.KERAMO_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.useAndroidX=true \
            -PversionCode=${{ github.run_number }} \
            -PversionName=v${{ github.run_number }}

      - name: APK artifact olaraq saxla
        uses: actions/upload-artifact@v4
        with:
          name: plite-tap-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Uğursuzluqda hesabat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
