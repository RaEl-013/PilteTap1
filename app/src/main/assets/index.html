<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plitə tap</title>
<style>
:root{--bg:#f2f0ec;--card:#fff;--ink:#1d2327;--mut:#6b7378;--line:#d9d5cd;--acc:#1f5f74;--acc-ink:#fff;--ok:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1c;--card:#22272a;--ink:#eceae5;--mut:#98a0a5;--line:#363d41;--acc:#5fb3cc;--acc-ink:#0f1a1e;--ok:#6fcf97}}
:root[data-theme="dark"]{--bg:#171a1c;--card:#22272a;--ink:#eceae5;--mut:#98a0a5;--line:#363d41;--acc:#5fb3cc;--acc-ink:#0f1a1e;--ok:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:-.01em}
p.sub{margin:0 0 14px;color:var(--mut)}
nav{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
nav button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:12px;border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:12px;font-size:1rem;margin-top:8px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.q{display:flex;gap:12px;align-items:center}
.q img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.res{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none}
.res b{display:block;font-size:1.05rem;word-break:break-word}
.tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-top:2px}
.pct{margin-left:auto;font-weight:800;font-size:1.3rem;color:var(--mut);flex:none}
.res.top .pct{color:var(--ok)}
.res.top img{outline:3px solid var(--ok)}
.msg{color:var(--mut);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.it{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.it div{padding:6px 8px;font-size:.85rem;word-break:break-word}
.it button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>

  <div class="row" style="gap:10px;margin-bottom:2px">

</main>

    <div id="fr" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none"></div>

  <div class="row" style="width:100%;max-width:420px;gap:10px;align-items:center">
    <span style="color:#fff;font-size:.85rem">Ölçü:</span>
    <select id="tsz" style="flex:1;font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)">
      <optgroup label="Kafel">
        <option value="60x120">60×120 sm</option>

  <div id="lv" hidden style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;max-width:420px;width:100%;cursor:pointer">
    <img id="lvi" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none">
    <div style="flex:1;min-width:0"><div style="color:#fff;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="lvn"></div><div style="color:#cfd6da;font-size:.78rem" id="lvty"></div></div>
    <div style="color:#8be28b;font-weight:800;font-size:1.05rem;flex:none" id="lvp"></div>

  <div class="msg" id="ce" style="color:#fff"></div>

<script src="ort/ort.wasm.min.js"></script>
<script src="ocr/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let ipcRenderer=null;try{ipcRenderer=require('electron').ipcRenderer}catch(e){}
/* ---------- ONNX Runtime Web (Electron olmayan mühitlər üçün, məs. Android) ---------- */
let ortReady=null;
async function ensureOrt(){
  if(ortReady)return ortReady;
  if(typeof ort==='undefined')throw new Error('ONNX Runtime Web tapılmadı (ort/ qovluğu yoxdur)');
  ort.env.wasm.numThreads=1;ort.env.wasm.simd=true;ort.env.wasm.wasmPaths='ort/';
  const [sd,sc]=await Promise.all([
    ort.InferenceSession.create('model/model_quantized.onnx'),
    ort.InferenceSession.create('model/clip_vision_quantized.onnx')
  ]);
  ortReady={sd,sc};return ortReady;
}
function unitArr(v){let n=0;for(let i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;const o=new Float32Array(v.length);for(let i=0;i<v.length;i++)o[i]=v[i]/n;return o}
async function embedWeb(f,g){
  const{sd,sc}=await ensureOrt();
  const od=await sd.run({pixel_values:new ort.Tensor('float32',f,[1,3,224,224])});
  const h=od.last_hidden_state,dd=h.data,N=h.dims[1],D=h.dims[2];
  const cls=dd.slice(0,D),mean=new Float32Array(D);
  for(let i=1;i<N;i++)for(let j=0;j<D;j++)mean[j]+=dd[i*D+j];
  for(let j=0;j<D;j++)mean[j]/=(N-1);
  const uc=unitArr(cls),um=unitArr(mean),dvec=new Array(D*2);
  for(let j=0;j<D;j++){dvec[j]=uc[j]/Math.SQRT2;dvec[D+j]=um[j]/Math.SQRT2}
  const oc=await sc.run({pixel_values:new ort.Tensor('float32',g,[1,3,224,224])});
  return{d:dvec,c:Array.from(unitArr(oc.image_embeds.data))};
}
async function embed(f,g){return ipcRenderer?await ipcRenderer.invoke('embed',f,g):await embedWeb(f,g)}
/* ---------- OCR (etiket oxumaq) ---------- */
let ocrWorker=null;
async function ensureOcr(){
  if(ocrWorker)return ocrWorker;
  if(typeof Tesseract==='undefined')throw new Error('OCR modulu tapılmadı');
  ocrWorker=await Tesseract.createWorker('eng',1,{workerPath:'ocr/worker.min.js',corePath:'ocr/tesseract-core-simd-lstm.js',langPath:'ocr/',gzip:false});
  return ocrWorker;
}
async function readLabel(canvas){
  try{
    const w=await ensureOcr(),{data:{text}}=await w.recognize(canvas);
    const t=(text||'').trim();if(!t)return'';
    const m=t.match(/[A-Za-z0-9][A-Za-z0-9\-\.\/]{2,}/g);
    if(m&&m.length){return m.sort((a,b)=>b.length-a.length)[0]}
    return t.split('\n')[0].trim();
  }catch(e){return''}
}
let W={d:.4,c:.4,o:.2};try{const w=JSON.parse(localStorage.getItem('plite_w'));if(w&&w.d!=null)W=w}catch(e){}
/* ---------- storage (IndexedDB) ---------- */
let mem=[];let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('plite',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function all(){try{const d=await db();return await new Promise((res,rej)=>{const q=d.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return mem}}
async function put(o){try{const d=await db();await new Promise((res,rej)=>{const q=d.transaction('items','readwrite').objectStore('items').add(o);q.onsuccess=res;q.onerror=()=>rej(q.error)})}catch(e){o.id=Date.now()+Math.random();mem.push(o)}}
async function del(id){try{const d=await db();await new Promise((res,rej)=>{const q=d.transaction('items','readwrite').objectStore('items').delete(id);q.onsuccess=res;q.onerror=()=>rej(q.error)})}catch(e){mem=mem.filter(x=>x.id!==id)}}

async function upd(o){try{const d=await db();await new Promise((res,rej)=>{const q=d.transaction('items','readwrite').objectStore('items').put(o);q.onsuccess=res;q.onerror=()=>rej(q.error)})}catch(e){mem=mem.map(x=>x.id===o.id?o:x)}}
function loadUrl(u){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Şəkil açılmadı'));i.src=u})}
/* ---------- DINOv2 embedding (main prosesdə işləyir) ---------- */
const CROPS=[[0,0,1],[.2,.2,.6],[0,0,.55],[.45,0,.55],[0,.45,.55],[.45,.45,.55]];
async function dino(src,rot,cr){
  cr=cr||CROPS[0];
  const S=224,W=src.naturalWidth||src.width,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d',{willReadFrequently:true});
  x.translate(S/2,S/2);x.rotate(rot*Math.PI/2);x.drawImage(src,cr[0]*W,cr[1]*W,cr[2]*W,cr[2]*W,-S/2,-S/2,S,S);
  const d=x.getImageData(0,0,S,S).data,n=S*S,f=new Float32Array(3*n),g=new Float32Array(3*n),M=[.485,.456,.406],SD=[.229,.224,.225],MC=[.48145466,.4578275,.40821073],SC=[.26862954,.26130258,.27577711];
  for(let i=0;i<n;i++)for(let ch=0;ch<3;ch++){const v=d[i*4+ch]/255;f[ch*n+i]=(v-M[ch])/SD[ch];g[ch*n+i]=(v-MC[ch])/SC[ch]}
  return await embed(f,g);
}
async function itemEmbs(c){const o=[];for(const cr of CROPS)o.push(await dino(c,0,cr));return o}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
async function migrate(){
  const items=(await all()).filter(x=>!x.v2);if(!items.length)return;
  for(let i=0;i<items.length;i++){
    $('mig').hidden=false;$('mig').textContent='Kataloq yeni üsulla yenilənir: '+(i+1)+' / '+items.length;
    try{const im=await loadUrl(items[i].thumb);items[i].v2=await itemEmbs(im);await upd(items[i])}catch(e){$('mig').textContent='Xəta: '+e.message;return}
  }
  $('mig').hidden=true;render();
}
/* ---------- avto-tenzimleme ---------- */
function variantsOf(img){
  const w=img.naturalWidth||img.width;
  const mk=fn=>{const c=document.createElement('canvas');c.width=c.height=320;const x=c.getContext('2d');fn(x);return c};
  return [
    mk(x=>{x.filter='brightness(0.7) contrast(1.1)';x.drawImage(img,0,0,320,320)}),
    mk(x=>{x.drawImage(img,.2*w,.2*w,.6*w,.6*w,0,0,320,320)}),
    mk(x=>{x.filter='blur(1.5px) brightness(1.15)';x.drawImage(img,0,0,320,320)})
  ];
}
const CAND=[[.4,.4,.2],[1,0,0],[0,1,0],[0,0,1],[.5,.5,0],[.6,.2,.2],[.2,.6,.2],[.7,0,.3],[0,.7,.3],[.5,.25,.25],[.25,.5,.25]];
async function tune(){
  const btn=$('tune');btn.disabled=true;$('tres').textContent='';
  try{
    const its=(await all()).filter(x=>x.v2);

    const pick=its.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,60);
    const comps=[];let n=0;const total=pick.length*3;
    for(const qi of pick){
      const img=await loadUrl(its[qi].thumb);
      for(const vc of variantsOf(img)){
        n++;$('tst').textContent='Yoxlanılır: '+n+' / '+total;
        const qe=[await dino(vc,0,CROPS[0]),await dino(vc,0,CROPS[1])],qf=feat(vc,0);
        const D=[],C=[],O=[];
        for(const it of its){
          let dd=-1,cc=-1;
          for(let a=0;a<2;a++)for(let b=0;b<it.v2.length;b++){const p=a===b?0:.04,x1=dot(qe[a].d,it.v2[b].d)-p,x2=dot(qe[a].c,it.v2[b].c)-p;if(x1>dd)dd=x1;if(x2>cc)cc=x2}

      return{ok,wrong}};
    const res=CAND.map(run);let bi=0;res.forEach((r,i)=>{if(r.ok>res[bi].ok)bi=i});
    const pc=r=>Math.round(100*r.ok/comps.length)+'%';
    const nm=w=>(w[0]?'DINO '+w[0]+' ':'')+(w[1]?'CLIP '+w[1]+' ':'')+(w[2]?'rəng '+w[2]:'');
    W={d:CAND[bi][0],c:CAND[bi][1],o:CAND[bi][2]};try{localStorage.setItem('plite_w',JSON.stringify(W))}catch(e){}
    const bad=Object.entries(res[bi].wrong).sort((a,b)=>b[1]-a[1]).slice(0,5);
    $('tres').textContent='Nəticə ('+comps.length+' sınaq): tək DINO '+pc(res[1])+', tək CLIP '+pc(res[2])+', tək rəng '+pc(res[3])+'\n'+
      'Ən yaxşı: '+nm(CAND[bi])+'→ '+pc(res[bi])+' (tətbiq olundu)\n'+
      (bad.length?'Ən çox qarışan modellər:\n'+bad.map(([k,v])=>'  '+k+' ('+v+')').join('\n'):'Qarışan model tapılmadı.');
    $('tst').textContent='Bitdi.';
  }catch(e){$('tst').textContent='Xəta: '+e.message}
  finally{btn.disabled=false}

function squareCanvas(img,size){const c=document.createElement('canvas');c.width=c.height=size;const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,m=Math.min(w,h);c.getContext('2d').drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,size,size);return c}
function feat(src,rot){
  const S=48,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d',{willReadFrequently:true});
  x.translate(S/2,S/2);x.rotate(rot*Math.PI/2);x.drawImage(src,-S/2,-S/2,S,S);
  const d=x.getImageData(0,0,S,S).data,g=new Float32Array(S*S);
  const grid=new Float32Array(48),gn=new Float32Array(16),hist=new Float32Array(64);
  for(let y=0;y<S;y++)for(let i=0;i<S;i++){
    const k=(y*S+i)*4,r=d[k],gg=d[k+1],b=d[k+2];g[y*S+i]=.299*r+.587*gg+.114*b;
    const cell=((y/12)|0)*4+((i/12)|0);grid[cell*3]+=r;grid[cell*3+1]+=gg;grid[cell*3+2]+=b;gn[cell]++;
    hist[(r>>6)*16+(gg>>6)*4+(b>>6)]++;
  }
  for(let c2=0;c2<16;c2++)for(let j=0;j<3;j++)grid[c2*3+j]/=gn[c2]*255;
  for(let j=0;j<64;j++)hist[j]/=S*S;
  const hog=new Float32Array(72);
  for(let y=1;y<S-1;y++)for(let i=1;i<S-1;i++){
    const gx=g[y*S+i+1]-g[y*S+i-1],gy=g[(y+1)*S+i]-g[(y-1)*S+i],mag=Math.hypot(gx,gy);
    if(mag<4)continue;let a=Math.atan2(gy,gx);if(a<0)a+=Math.PI;
    const bin=Math.min(7,(a/Math.PI*8)|0),cell=((y/16)|0)*3+((i/16)|0);hog[cell*8+bin]+=mag;
  }
  let n=0;for(const v of hog)n+=v*v;n=Math.sqrt(n)||1;for(let j=0;j<72;j++)hog[j]/=n;
  return{g:Array.from(grid),h:Array.from(hist),o:Array.from(hog)};
}
function sim(a,b){
  let s1=0;for(let i=0;i<48;i++)s1+=Math.abs(a.g[i]-b.g[i]);s1=1-s1/48;
  let s2=0;for(let i=0;i<64;i++)s2+=Math.min(a.h[i],b.h[i]);
  let s3=0;for(let i=0;i<72;i++)s3+=a.o[i]*b.o[i];
  return .4*s1+.3*s2+.3*Math.max(0,s3);
}

const SIZES={'60x120':[60,120],'60x30':[60,30],'60x60':[60,60],'50x50':[50,50],'40x40':[40,40],'60x20':[60,20]};
function getRatio(){const v=SIZES[$('tsz').value]||[1,1];return Math.min(v[0],v[1])/Math.max(v[0],v[1])}
function frameSize(cw,ch,r){
  cw*=.92;ch*=.92;
  let A={w:cw,h:cw*r};if(A.h>ch){A={w:ch/r,h:ch}}
  let B={w:ch*r,h:ch};if(B.w>cw){B={w:cw,h:cw/r}}
  return (A.w*A.h>=B.w*B.h)?A:B;
}

  const r=getRatio(),cw=v.clientWidth,ch=v.clientHeight;
  if(!cw||!ch)return frameSize(v.videoWidth,v.videoHeight,r);
  const disp=frameSize(cw,ch,r),sx=v.videoWidth/cw,sy=v.videoHeight/ch;
  return{w:(disp.w*sx)/z,h:(disp.h*sy)/z};
}
function drawLetterboxed(v,cropW,cropH,outSize){
  const vw=v.videoWidth,vh=v.videoHeight,c=document.createElement('canvas');c.width=c.height=outSize;
  const x=c.getContext('2d');x.fillStyle='#c8c8c8';x.fillRect(0,0,outSize,outSize);
  const scale=Math.min(outSize/cropW,outSize/cropH),dw=cropW*scale,dh=cropH*scale,dx=(outSize-dw)/2,dy=(outSize-dh)/2;
  x.drawImage(v,(vw-cropW)/2,(vh-cropH)/2,cropW,cropH,dx,dy,dw,dh);
  return c;
}

let stream=null,anT=null,hist=[],anC=null,liveTick=0,liveBusy=false;
let autoZoom=1;
async function openCam(){$('cm').hidden=false;$('ce').textContent='';$('lv').hidden=true;autoZoom=1;$('zmv').textContent='Zoom 1.0x';$('cv').style.transform='scale(1)';lastQ=null;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('cv').srcObject=stream;hist=[];liveTick=0;clearInterval(anT);anT=setInterval(analyze,400)}catch(e){$('ce').textContent='Kamera açılmadı. Kameranın qoşulduğunu və icazə verildiyini yoxla.'}}
function closeCam(){clearInterval(anT);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cm').hidden=true;$('lv').hidden=true}
function analyzePixels(d,S){
  const n=S*S,L=new Float32Array(n),q=[0,0,0,0],qn=[0,0,0,0],rr=[0,0,0],cr=[0,0,0];
  let sum=0,dark=0,bright=0,rn=0,cn=0;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x,k=i*4,l=.299*d[k]+.587*d[k+1]+.114*d[k+2];
    L[i]=l;sum+=l;if(l<25)dark++;if(l>245)bright++;
    const qi=(y>=S/2?2:0)+(x>=S/2?1:0);q[qi]+=l;qn[qi]++;
    if(x<8||y<8||x>=S-8||y>=S-8){rr[0]+=d[k];rr[1]+=d[k+1];rr[2]+=d[k+2];rn++}
    else if(x>=S*.3&&x<S*.7&&y>=S*.3&&y<S*.7){cr[0]+=d[k];cr[1]+=d[k+1];cr[2]+=d[k+2];cn++}
  }
  const mean=sum/n,qm=q.map((a,i)=>a/qn[i]);
  const ev=(Math.max(...qm)-Math.min(...qm))/Math.max(mean,1);
  let ls=0,l2=0,m=0;
  for(let y=1;y<S-1;y++)for(let x=1;x<S-1;x++){const i=y*S+x,p=4*L[i]-L[i-1]-L[i+1]-L[i-S]-L[i+S];ls+=p;l2+=p*p;m++}
  const lv=l2/m-(ls/m)*(ls/m);
  const dist=Math.hypot(rr[0]/rn-cr[0]/cn,rr[1]/rn-cr[1]/cn,rr[2]/rn-cr[2]/cn);
  return{mean,dark:dark/n,bright:bright/n,ev,lv,dist};
}
function judge(a,peak,histLen){
  const r=[];
  if(a.mean<70)r.push(['bad','İşıq azdır']);
  else if(a.mean<95)r.push(['warn','İşıq zəifdir']);
  else if(a.mean>200)r.push(['warn','İşıq çoxdur']);
  else if(a.bright>.08)r.push(['warn','Parıltı var']);
  else if(a.dark>.08)r.push(['warn','Qaranlıq sahə var']);
  else r.push(['ok','İşıq yaxşı']);
  r.push(a.ev>.35?['warn','Kölgə var']:['ok','Kölgə yox']);
  r.push(histLen>=6&&peak>25&&a.lv<.45*peak?['warn','Bulanıqdır, sabit tut']:['ok','Kəskindir']);
  r.push(a.dist>60?['warn','Yaxınlaş']:['ok','Məsafə yaxşı']);
  return r;
}
function analyze(){
  const v=$('cv');if(!v.videoWidth||$('cm').hidden)return;
  const S=96,{w:cw,h:ch}=videoCropRect(v,autoZoom),lc=drawLetterboxed(v,cw,ch,S);
  const a=analyzePixels(lc.getContext('2d').getImageData(0,0,S,S).data,S);
  if(a.dist>60&&autoZoom<3){autoZoom=Math.min(3,autoZoom+0.08)}
  $('cv').style.transform='scale('+autoZoom+')';
  $('zmv').textContent='Zoom '+autoZoom.toFixed(1)+'x';
  hist.push(a.lv);if(hist.length>12)hist.shift();
  const res=judge(a,Math.max(...hist),hist.length);
  const bad=res.some(r=>r[0]==='bad'),warn=res.some(r=>r[0]!=='ok'),col=bad?'#e74c3c':warn?'#f39c12':'#2ecc71';
  $('fr').style.borderColor=col;
  $('chk').innerHTML='<div style="font-weight:700;color:'+col+'">'+(warn?'Standarta uyğun deyil':'Standarta uyğundur ✓')+'</div>'+
    res.map(r=>'<div style="color:'+(r[0]==='ok'?'#2ecc71':r[0]==='bad'?'#e74c3c':'#f39c12')+'">'+(r[0]==='ok'?'✓ ':'! ')+r[1]+'</div>').join('');
  $('cs').textContent=warn?'Yenə də çək':'Çək ✓';
  liveTick++;
  if(!bad&&!liveBusy&&liveTick%3===0){liveBusy=true;liveMatch(v,autoZoom).finally(()=>{liveBusy=false})}
}
async function liveMatch(v,z){
  try{
    const items=(await all()).filter(x=>x.v2);
    if(!items.length){$('lv').hidden=true;return}
    const{w:cw,h:ch}=videoCropRect(v,z),qc=drawLetterboxed(v,cw,ch,256);
    const emb=await dino(qc,0,CROPS[0]),qf=feat(qc,0);
    const best=new Map();
    for(const it of items){
      let dd=-1,cc=-1;
      for(const e of it.v2){const x1=dot(emb.d,e.d),x2=dot(emb.c,e.c);if(x1>dd)dd=x1;if(x2>cc)cc=x2}
      const vv=W.d*dd+W.c*cc+W.o*sim(qf,it.f),key=it.type+'|'+it.name,prev=best.get(key);
      if(!prev||vv>prev.vv)best.set(key,{it,vv});
    }
    let top=null;for(const val of best.values())if(!top||val.vv>top.vv)top=val;
    if(top&&!$('cm').hidden){
      $('lv').hidden=false;$('lvi').src=top.it.thumb;$('lvn').textContent=top.it.name;
      $('lvty').textContent=top.it.type==='kafel'?'Kafel':'Metlax';$('lvp').textContent=Math.round(top.vv*100)+'%';
    }
  }catch(e){}
}
function placeFrame(){const v=$('cv');if(!v.clientWidth)return;const f=frameSize(v.clientWidth,v.clientHeight,getRatio());$('fr').style.width=Math.round(f.w)+'px';$('fr').style.height=Math.round(f.h)+'px'}
$('cv').onloadedmetadata=placeFrame;$('cv').onplaying=placeFrame;window.addEventListener('resize',placeFrame);
let camMode='search',catalogShots=[];
const SHOT_HINTS=[
  'Düz qarşıdan, adi işıqda çək',
  'Eyni plitəni 90° çevirib çək',
  'Bir az yaxından çək',
  'Bir az uzaqdan çək',
  'Yan bucaqdan, bir az əyərək çək',
  'Zəif işıqda və ya kölgəli tərəfdən çək'
];
function openCamFor(mode){
  camMode=mode;catalogShots=[];
  $('csdone').hidden=mode!=='catalog';
  $('csrow').hidden=true;$('csrow').innerHTML='';
  if(mode==='catalog')renderShots();else $('csinfo').hidden=true;
  openCam();
}
function renderShots(){
  const row=$('csrow');row.innerHTML='';
  catalogShots.forEach((c,i)=>{
    const im=new Image();im.src=c.toDataURL('image/jpeg',.6);
    im.style.cssText='width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid #fff;flex:none;cursor:pointer';
    im.title='Silmək üçün bas';im.onclick=()=>{catalogShots.splice(i,1);renderShots()};
    row.append(im);
  });
  row.hidden=!catalogShots.length;
  const n=catalogShots.length;
  $('csinfo').hidden=false;
  $('csinfo').textContent=n>=6?'6 şəkil tamamlandı. Bitir bas.':(n+1)+'/6: '+SHOT_HINTS[n];
  $('csdone').textContent='Bitir ('+n+')';
}
$('camb').onclick=()=>openCamFor('search');
$('ccamb').onclick=()=>openCamFor('catalog');
$('cx').onclick=closeCam;
function doCapture(){
  const v=$('cv');if(!v.videoWidth)return;
  const{w:cw,h:ch}=videoCropRect(v,autoZoom),c=drawLetterboxed(v,cw,ch,320);
  if(camMode==='catalog'){
    catalogShots.push(c);renderShots();
    if(catalogShots.length>=6)finishCatalogCapture();
    return;
  }
  c.toBlob(b=>{closeCam();search(new File([b],'kamera.jpg',{type:'image/jpeg'}))},'image/jpeg',.92)
}
async function finishCatalogCapture(){
  if(!catalogShots.length)return;
  closeCam();
  $('cci').src=catalogShots[0].toDataURL('image/jpeg',.8);
  $('ccn').value='';$('cct').value=$('nt').value;$('ccm').textContent='';
  $('ccn2').textContent=catalogShots.length+' şəkil';
  $('cc').hidden=false;
  $('ccn').placeholder='Oxunur...';
  try{
    const guess=await readLabel(catalogShots[0]);
    if(guess&&!$('ccn').value){$('ccn').value=guess;$('ccm').textContent='Etiketdən oxundu, lazım olsa düzəlt.'}
  }catch(e){}
  $('ccn').placeholder='Məs: K-101';
}
$('csdone').onclick=finishCatalogCapture;
$('cs').onclick=doCapture;
$('lv').onclick=doCapture;
render();migrate();renderHist();
</script>
